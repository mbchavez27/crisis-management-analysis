[project]
name = "llm-passes"
version = "0.1.0"
description = "Local vLLM coding runner for the crisis comment codebook"
requires-python = ">=3.11,<3.13"
dependencies = [
    # 0.11.0: supports Gemma 2's full 8K context AND still has bitsandbytes 4-bit,
    # and its torch (2.8.0) ships as a CUDA 12.8 build that driver 575 can run.
    "vllm==0.11.0",
    "transformers>=4.56,<5",
    "bitsandbytes>=0.46.1",
    "setuptools<81",
    "pandas>=2.2,<3",
    "tqdm>=4.66",
]
