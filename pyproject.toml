[project]
name = "crisis-management-analysis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate>=1.15.0",
    "bertopic>=0.17.4",
    "bitsandbytes>=0.50.2",
    "calamancy>=0.1.2",
    "emoji>=2.15.0",
    "google-genai>=2.10.0",
    "matplotlib>=3.11.0",
    "nbformat>=4.2.0",
    "nltk>=3.9.4",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "papermill>=2.7.0",
    "protobuf>=7.35.1",
    "python-dotenv>=1.2.2",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.6.0",
    "sentencepiece>=0.2.1",
    "spacy>=3.8.14",
    "tiktoken>=0.13.0",
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "torchvision==0.20.1",
    "tqdm>=4.66.0",
    "transformers>=5.12.1",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
