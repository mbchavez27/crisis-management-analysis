[project]
name = "analysis"
version = "0.1.0"
description = "Sentiment analysis and BERTopic topic modeling (XLM-R, calamancy; CUDA 12.6 torch on Linux/Windows, CPU/MPS torch on macOS)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate>=1.15.0",
    "bertopic>=0.17.4",
    "bitsandbytes>=0.50.2; sys_platform != 'darwin'",
    "calamancy>=0.1.2",
    "emoji>=2.15.0",
    "google-genai>=2.10.0",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.0",
    "nbformat>=4.2.0",
    "nltk>=3.9.4",
    "numpy>=2.4.6",
    "nvidia-cublas-cu12>=12.6,<13; sys_platform != 'darwin'",
    "nvidia-cuda-cupti-cu12>=12.6,<13; sys_platform != 'darwin'",
    "nvidia-cuda-nvrtc-cu12>=12.6,<13; sys_platform != 'darwin'",
    "nvidia-cuda-runtime-cu12>=12.6,<13; sys_platform != 'darwin'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform != 'darwin'",
    "nvidia-cufft-cu12>=11.3,<12; sys_platform != 'darwin'",
    "nvidia-cufile-cu12>=1.11,<2; sys_platform != 'darwin'",
    "nvidia-curand-cu12>=10.3,<11; sys_platform != 'darwin'",
    "nvidia-cusolver-cu12>=11.7,<12; sys_platform != 'darwin'",
    "nvidia-cusparse-cu12>=12.5,<13; sys_platform != 'darwin'",
    "nvidia-cusparselt-cu12==0.6.3; sys_platform != 'darwin'",
    "nvidia-nccl-cu12>=2.23,<3; sys_platform != 'darwin'",
    "nvidia-nvjitlink-cu12>=12.6,<13; sys_platform != 'darwin'",
    "nvidia-nvtx-cu12>=12.6,<13; sys_platform != 'darwin'",
    "pandas>=3.0.3",
    "papermill>=2.7.0",
    "protobuf>=7.35.1",
    "python-dotenv>=1.2.2",
    "scipy>=1.14",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.6.0",
    "sentencepiece>=0.2.1",
    "spacy>=3.8.14",
    "tiktoken>=0.13.0",
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "torchvision==0.21.0",
    "tqdm>=4.66.0",
    "transformers>=5.12.1",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

# CUDA wheels only exist for Linux/Windows; macOS falls back to the default PyPI
# torch build (CPU + Apple MPS). NVIDIA runtime packages and bitsandbytes above
# are skipped on macOS for the same reason.
[tool.uv.sources]
torch = { index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }
torchaudio = { index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }
torchvision = { index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }
